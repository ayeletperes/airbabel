Kong R, Duan H, Sheng Z, Xu K, Acharya P, Chen X, et al. Antibody lineages with \
vaccine-induced antigen-binding hotspots develop broad HIV neutralization. Cell. \
2019;178(3):567-584.e19."""
doi = "10.1016/j.cell.2019.06.030"
note = "Identified indirectly: Guo et al. (Front Immunol 2024;15:1506348) cites this study as the VRC set of 187 IgDiscover-inferred germline alleles from four Indian rhesus macaques. CONFIRM against the MUSA source table."

